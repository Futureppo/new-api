name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra image tag"
        required: false
        default: ""
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64"

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.version }}
      matrix: ${{ steps.vars.outputs.matrix }}
      platforms: ${{ steps.vars.outputs.platforms }}
      has_amd64: ${{ steps.vars.outputs.has_amd64 }}
      has_arm64: ${{ steps.vars.outputs.has_arm64 }}

    steps:
      - name: Prepare image metadata
        id: vars
        shell: bash
        env:
          REQUESTED_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}"
          version="custom-$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          requested_platforms="${REQUESTED_PLATFORMS:-linux/amd64,linux/arm64}"
          requested_platforms="${requested_platforms//[[:space:]]/}"

          has_amd64=false
          has_arm64=false

          IFS=',' read -ra platforms <<< "$requested_platforms"
          for platform in "${platforms[@]}"; do
            case "$platform" in
              linux/amd64)
                has_amd64=true
                ;;
              linux/arm64)
                has_arm64=true
                ;;
              *)
                echo "::error::Unsupported platform '$platform'. Supported platforms: linux/amd64, linux/arm64"
                exit 1
                ;;
            esac
          done

          if [ "$has_amd64" = true ] && [ "$has_arm64" = true ]; then
            matrix='{"include":[{"arch":"amd64","platform":"linux/amd64"},{"arch":"arm64","platform":"linux/arm64"}]}'
            normalized_platforms="linux/amd64,linux/arm64"
          elif [ "$has_amd64" = true ]; then
            matrix='{"include":[{"arch":"amd64","platform":"linux/amd64"}]}'
            normalized_platforms="linux/amd64"
          elif [ "$has_arm64" = true ]; then
            matrix='{"include":[{"arch":"arm64","platform":"linux/arm64"}]}'
            normalized_platforms="linux/arm64"
          else
            echo "::error::At least one target platform is required"
            exit 1
          fi

          {
            echo "image=$image"
            echo "version=$version"
            echo "matrix=$matrix"
            echo "platforms=$normalized_platforms"
            echo "has_amd64=$has_amd64"
            echo "has_arm64=$has_arm64"
          } >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build and push (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "$VERSION" > VERSION

      - name: Prepare architecture tags
        id: tags
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          {
            echo "value<<EOF"
            echo "$IMAGE:latest-$ARCH"
            echo "$IMAGE:$VERSION-$ARCH"
            if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "latest" ]; then
              echo "$IMAGE:$REQUESTED_TAG-$ARCH"
            fi

            if [ "$ARCH" = "amd64" ]; then
              echo "$IMAGE:latest"
              echo "$IMAGE:$VERSION"
              if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "latest" ]; then
                echo "$IMAGE:$REQUESTED_TAG"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Output image tags
        env:
          TAGS: ${{ steps.tags.outputs.value }}
        run: |
          echo "### Published image (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create image manifests
    needs:
      - prepare
      - build_single_arch
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        env:
          HAS_AMD64: ${{ needs.prepare.outputs.has_amd64 }}
          HAS_ARM64: ${{ needs.prepare.outputs.has_arm64 }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          sources=()
          if [ "$HAS_AMD64" = "true" ]; then
            sources+=("$IMAGE:$VERSION-amd64")
          fi
          if [ "$HAS_ARM64" = "true" ]; then
            sources+=("$IMAGE:$VERSION-arm64")
          fi

          publish_manifest() {
            local tag="$1"
            docker buildx imagetools create \
              -t "$IMAGE:$tag" \
              "${sources[@]}"
          }

          publish_manifest latest
          publish_manifest "$VERSION"
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "latest" ]; then
            publish_manifest "$REQUESTED_TAG"
          fi

      - name: Output manifest details
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "### Published image manifests" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: \`$PLATFORMS\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
