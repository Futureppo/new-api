name: Publish Docker image to GHCR

on:
  push:
    tags:
      - '*'

jobs:
  prepare:
    name: Prepare image metadata
    if: github.event.created
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Prepare image metadata
        id: vars
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}"
          version="custom-$(date +'%Y%m%d')-${GITHUB_SHA::7}"

          {
            echo "image=$image"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build and push (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "$VERSION" > VERSION

      - name: Prepare architecture tags
        id: tags
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "value<<EOF"
            echo "$IMAGE:latest-$ARCH"
            echo "$IMAGE:$VERSION-$ARCH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Output image tags
        env:
          TAGS: ${{ steps.tags.outputs.value }}
        run: |
          echo "### Published image (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create image manifests
    needs:
      - prepare
      - build_single_arch
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"

      - name: Output manifest details
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "### Published image manifests" >> "$GITHUB_STEP_SUMMARY"
          echo 'Platforms: `linux/amd64,linux/arm64`' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
